<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo menu dọc dropdown</title>
    <style>
        /* Cố định font chữ và căn lề cơ bản */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background-color: #f4f4f4;
        }

        #menu {
            width: 200px;
        }

        /* Định dạng các phần tử trong danh sách (li) */
        #menu ul li {
            list-style: none;
            position: relative;
            width: 140px;
            height: 30px;
            padding: 0 20px;
            background-color: black;
            line-height: 30px;
            cursor: pointer;
            margin-bottom: 2px;
        }

        /* Định nghĩa liên kết bên trong danh sách (thẻ a) */
        #menu ul li a {
            text-decoration: none;
            color: white;
            display: block;
        }

        /* Thay đổi màu nền khi đưa chuột qua phần tử danh sách */
        #menu ul li:hover {
            background-color: #444;
        }

        /* Định nghĩa cho các danh sách con (dropdown) */
        #menu ul li ul {
            position: absolute;
            top: 0;
            left: 180px; /* Đặt vị trí xuất hiện của danh sách con bên phải */
            visibility: hidden; /* Ẩn các danh sách con mặc định */
            padding: 0;
        }

        /* Hiển thị danh sách con khi đưa con trỏ qua phần tử danh sách ngoài */
        #menu ul li:hover > ul {
            visibility: visible;
        }
    </style>
</head>
<body>

    <div id="menu">
        <ul>
            <li><a href="#">Trang chủ</a></li>
            <li><a href="#">Sản phẩm</a>
                <ul>
                    <li><a href="#">Laptop</a></li>
                    <li><a href="#">Điện thoại</a></li>
                    <li><a href="#">Máy tính bảng</a></li>
                </ul>
            </li>
            <li><a href="#">Dịch vụ</a>
                <ul>
                    <li><a href="#">Tư vấn</a></li>
                    <li><a href="#">Bảo trì</a></li>
                </ul>
            </li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
    </div>

</body>
</html>
